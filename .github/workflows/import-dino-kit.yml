name: Dinosaur Kit Run 1B diagnostics only
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Enter RUN1B-APPROVED only after Tab B and Cameron approve the exact files'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dinosaur-kit-run1-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/rc/dino-kit-v1' && inputs.approval == 'RUN1B-APPROVED' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact revision and setup
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          git rev-parse HEAD | tee diagnostics/commit.txt
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.2/blender-4.2.8-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/blender"
          "$RUNNER_TEMP/blender/blender" --version | tee diagnostics/blender-version.txt
      - name: Verify exact local source files and licence
        run: |
          set -euo pipefail
          status=1
          echo "$status" > "$GITHUB_WORKSPACE/diagnostics/download-status.txt"
          cd "$GITHUB_WORKSPACE/sources"
          ls -la | tee "$GITHUB_WORKSPACE/diagnostics/source-list.txt"
          test "$(wc -l < SHA256SUMS)" -eq 7
          sha256sum -c SHA256SUMS
          grep -q 'CC0 1.0' License.txt
          echo 0 > "$GITHUB_WORKSPACE/diagnostics/download-status.txt"
      - name: Diagnose every species in Blender
        run: |
          set -euo pipefail
          status=0
          for name in TRex Triceratops Stegosaurus Velociraptor Apatosaurus Parasaurolophus; do
            mkdir -p "diagnostics/$name"
            echo "=== $name ==="
            if test -s "$GITHUB_WORKSPACE/sources/$name.blend" && "$RUNNER_TEMP/blender/blender" --background --disable-autoexec "$GITHUB_WORKSPACE/sources/$name.blend" --python-exit-code 1 --python scripts/diagnose_glb.py -- "diagnostics/$name" 2>&1 | tee "diagnostics/$name/blender.log"; then
              echo 0 > "diagnostics/$name/blender-status.txt"
            else
              echo 1 > "diagnostics/$name/blender-status.txt"
              status=1
            fi
          done
          echo "$status" > diagnostics/blender-status.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned runtime dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright-core install --with-deps chromium
      - name: Diagnose GLBs in Three.js and Khronos validator
        run: |
          set -euo pipefail
          status=0
          node scripts/diagnose_runtime.mjs diagnostics 2>&1 | tee diagnostics/runtime.log || status=1
          echo "$status" > diagnostics/runtime-status.txt
      - name: Preserve raw diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dinosaur-kit-run1b-diagnostics
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14
      # Expected to exit 1 if original assertion / raw bounds fail, after artifacts are preserved.
      - name: Consolidated failure gate
        if: always()
        run: |
          set -euo pipefail
          for f in download-status blender-status runtime-status; do
            test -f "diagnostics/$f.txt" && test "$(cat "diagnostics/$f.txt")" = 0 || exit 1
          done
          test -f diagnostics/runtime.json
